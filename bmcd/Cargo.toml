[package]
name = "bmcd"
version = "2.40.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98.1"

[dependencies]
schemars = "1"
actix = "0.13.5"
actix-files = "0.6.6"
# actix-http and actix-service are already in the tree as transitive
# dependencies of actix-web. They are named here because the HTTPS listener is
# built by hand in `main.rs`: `HttpServer::bind_openssl()` discards the
# acceptor's ALPN configuration, so the `HttpService` it would have assembled
# is assembled directly instead.
actix-http = { version = "3.11.2", features = ["openssl"] }
actix-multipart = "0.7.2"
actix-service = "2.0.3"
# Named explicitly so `on_connect_ext` can be given the concrete stream type
# and read the verified peer certificate off the handshake. Already in the
# tree as a transitive dependency of actix-web.
actix-tls = { version = "3.5.0", features = ["openssl"] }
actix-web = { version = "4.9.0", features = ["openssl"] }
actix-ws = "0.3.0"
anyhow = "1.0.95"
async-compression = { version = "0.4.18", features = ["tokio", "gzip", "xz"] }
async-trait = "0.1.86"
base64 = "0.22.1"
bincode = "1.3.3"
board-info = { path = "../board_info/" }
build-time = "0.1.3"
byteorder = "1.5.0"
bytes = "1.10.0"
chrono = "0.4.39"
circular-buffer = "0.1.9"
clap = { version = "4.5.29", features = ["cargo"] }
config = "0.15.8"
crc = "3.2.1"
crc32fast = "1.4.2"
evdev = { version = "0.13.0", features = ["tokio"] }
futures = "0.3.31"
gpiod = { version = "0.3.0" }
hex = "0.4.3"
humansize = "2.1.3"
humantime = "2.1.0"
if-addrs = "0.13.3"
inotify = "0.11.0"
nix = { version = "0.29.0", features = ["fs", "feature"] }
openssl = "0.10.70"
pin-project = "1.1.9"
pwhash = "1.0.0"
rand = "0.9.0"
reqwest = { version = "0.12.12", features = ["stream"] }
rockfile = { version = "0.1.2" }
rockusb = { version = "0.2.0", features = ["libusb"] }
rusb = "0.9.4"
rustpiboot = "0.3.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
serde_with = "3.12.0"
sha2 = "0.10.8"
tar = "0.4.43"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = [
    "rt-multi-thread",
    "rt",
    "time",
    "macros",
    "io-util",
    "net",
] }
tokio-serial = { version = "5.4.5", features = ["rt", "codec"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-util = { version = "0.7.13", features = ["io-util"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[dev-dependencies]
# Validates the published schemas against what the daemon actually
# serialises. A dev-dependency on purpose: it never reaches the board.
jsonschema = "0.30"
tempdir = "0.3.7"

[features]
stubbed = []
vendored = ["openssl/vendored"]

